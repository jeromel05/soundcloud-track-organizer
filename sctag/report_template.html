<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundCloud Likes</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #fff; --ink: #1b1b1a; --muted: #75716a; --faint: #a7a299; --line: #e7e4dd;
  --accent: #ff5500; --chip: #efede8; --chip-hover: #e5e2db; --chip-on: #1b1b1a; --chip-on-ink: #fff;
  --genre: #e2efe5; --genre-ink: #22553a; --mine: #2f8f4e;
  --hot: #ff5500; --cool: #4a7fd6; --mid: #cfcbc2;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --panel: #1a1a19; --ink: #edebe6; --muted: #9b978f; --faint: #6e6a64; --line: #2a2927;
    --chip: #242322; --chip-hover: #2f2e2c; --chip-on: #edebe6; --chip-on-ink: #111110;
    --genre: #1f3327; --genre-ink: #9fd8b2; --mine: #5cc27d; --mid: #4a4844; --cool: #6d9be6; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }

/* header: kind switch + actions, summary, tabs */
header { max-width: 1400px; margin: auto; padding: 20px 16px 0; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 13px; color: var(--muted); letter-spacing: .02em; margin-right: 4px; }
.kinds { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.kinds a { padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 15px; text-decoration: none; }
.kinds a.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.actions { margin-left: auto; display: flex; gap: 8px; }
.sub { color: var(--muted); font-size: 13px; }
header .sub { margin: 10px 0 0; }
nav.tabs { display: flex; gap: 20px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 10px 0; color: var(--muted); cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--chip); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0 4px; }
.chip { border: 0; background: var(--chip); color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer;
  font-size: 13px; }
.chip:hover { background: var(--chip-hover); }
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
.chip.sug:not(.on) { box-shadow: inset 0 0 0 1.5px var(--mine); }
.chip i { font-style: normal; opacity: .5; font-size: 11px; margin-left: 4px; }
.chip.more { background: none; color: var(--accent); }

main { max-width: 1400px; margin: auto; padding: 16px 16px 150px; }
input[type=search], input[type=text], select { font: inherit; padding: 7px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 0; }
input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: -1px; }

/* library toolbar + filters */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=search] { flex: 1 1 260px; max-width: 460px; }
#ftoggle b { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
.filters { margin-top: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; gap: 10px; }
.frow { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.frow .lbl { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 5px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type=range] { width: 140px; accent-color: var(--accent); }
.status { display: flex; gap: 8px; align-items: center; min-height: 20px; margin: 14px 0 10px; color: var(--muted); font-size: 13px; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.card { cursor: pointer; min-width: 0; }
.card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--chip); border-radius: 8px;
  transition: transform .15s, box-shadow .15s; }
.card:hover img { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.card .b { padding: 8px 2px 0; }
.t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta, .bpm { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; align-items: center; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--chip); }
.tag.g { background: var(--genre); color: var(--genre-ink); font-weight: 500; }
.tag.g.guess { background: none; box-shadow: inset 0 0 0 1px var(--genre); color: var(--muted); }
.tag.g.mine { box-shadow: inset 0 0 0 1px var(--mine); }
.tag.m { background: none; padding: 0; color: var(--faint); }
.tag.yours { background: var(--accent); color: #fff; font-weight: 600; margin-left: 4px; }
.tag.repost { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); background: none; margin-left: 4px; }
.card.wait img { opacity: .55; }
.pend { color: var(--muted); font-style: italic; }
.energy { display: flex; gap: 1px; height: 5px; margin-top: 7px; border-radius: 3px; overflow: hidden; }
.energy i { flex: 1; }
.e-hot { background: var(--hot); } .e-cool { background: var(--cool); } .e-mid { background: var(--mid); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

/* search tabs */
section h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.note { color: var(--muted); max-width: 820px; margin: 0 0 14px; }
.live { margin-bottom: 14px; }
.live input[type=search] { flex: 1 1 300px; max-width: 620px; }

/* details drawer */
#drawer { position: fixed; inset: 0 0 0 auto; width: min(480px, 100vw); background: var(--panel);
  border-left: 1px solid var(--line); overflow-y: auto; padding: 20px 20px 150px; transform: translateX(100%);
  transition: transform .2s; z-index: 5; box-shadow: -12px 0 30px rgba(0,0,0,.12); }
#drawer.open { transform: none; }
#drawer .close { position: sticky; top: 0; float: right; margin: -6px -6px 0 0; width: 32px; height: 32px; border-radius: 8px;
  background: var(--chip); border: 0; font-size: 18px; color: var(--ink); cursor: pointer; }
.head { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; margin-right: 34px; }
.head img { width: 112px; height: 112px; object-fit: cover; border-radius: 8px; background: var(--chip); }
.head h2 { font-size: 17px; line-height: 1.3; margin: 0 0 4px; }
.facts { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
.facts b { color: var(--ink); font-weight: 600; }
#drawer h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 22px 0 6px; font-weight: 600; }
#drawer details { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px; }
#drawer summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.labelbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 16px 0 0; background: var(--bg); }
.labelbox h3 { margin: 0 0 8px !important; }
.labelbox .row { margin-bottom: 8px; }
.labelbox .row:last-child { margin-bottom: 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
td { padding: 4px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.timeline td:first-child { width: 56px; }
.timeline td { text-align: left !important; color: var(--ink) !important; }
.similar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
#player { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; border: 0; z-index: 6; display: none;
  box-shadow: 0 -6px 20px rgba(0,0,0,.15); }

@media (max-width: 760px) {
  header { padding-top: 14px; }
  .brand { display: none; }
  .kinds a { padding: 6px 10px; font-size: 14px; }
  .actions { margin-left: 0; width: 100%; }
  .actions .btn { flex: 1; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .frow { grid-template-columns: 1fr; gap: 4px; }
  .frow .lbl { padding-top: 0; }
  .toolbar input[type=search] { flex-basis: 100%; max-width: none; }
  .head { grid-template-columns: 84px 1fr; }
  .head img { width: 84px; height: 84px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">SoundCloud likes</span>
    <div class="kinds"><a id="k-tracks" href="report_tracks.html">Tracks</a><a id="k-sets" href="report_sets.html">Sets &amp; podcasts</a></div>
    <div class="actions">
      <button id="refresh" class="btn" hidden title="fetch your new likes, posts and reposts from SoundCloud, analyze them, rebuild">⟳ Refresh likes</button>
      <button id="retrain" class="btn primary" hidden title="retrain the genre model with your labels and rebuild the pages"></button>
    </div>
  </div>
  <div class="sub" id="sub"></div>
  <nav class="tabs">
    <button data-v="lib" class="on">Library</button>
    <button data-v="vibe">Vibe search</button>
    <button data-v="cover">Cover search</button>
    <button data-v="todo" hidden>To label</button>
  </nav>
</header>
<main>
  <div id="lib">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search title, artist, tags…">
      <select id="sort" aria-label="Sort"></select>
      <button id="ftoggle" class="btn">Filters</button>
    </div>
    <div class="filters" id="filters">
      <div class="frow"><span class="lbl">Genre</span><span id="fg" class="row"></span></div>
      <div class="frow"><span class="lbl">Mood</span><span id="fm" class="row"></span></div>
      <div class="frow" id="erow" hidden><span class="lbl">Energy</span><span id="fe" class="row"></span></div>
      <div class="frow" id="srow"><span class="lbl">Source</span><span id="fs" class="row"></span></div>
      <div class="frow"><span class="lbl">BPM</span><span class="range">
        <input type="range" id="bmin" min="40" max="200" value="40" aria-label="lowest BPM">
        <input type="range" id="bmax" min="40" max="200" value="200" aria-label="highest BPM">
        <span class="bpm" id="bl"></span></span></div>
    </div>
    <div class="status"><span id="count"></span><button id="fclear" class="btn link" hidden>Clear filters</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="vibe" hidden>
    <p class="note"></p>
    <form class="row live" hidden><input type="search" name="q" placeholder="Describe a sound, e.g. “glitchy angelic vocals over a heavy kick”"><button class="btn primary">Search</button></form>
    <div class="grid results"></div>
    <div class="examples"></div>
  </div>
  <div id="cover" hidden>
    <p class="note"></p>
    <form class="row live" hidden><input type="search" name="q" placeholder="Describe a cover, e.g. “a pink blurry photo of a car”"><button class="btn primary">Search</button></form>
    <div class="grid results"></div>
    <div class="examples"></div>
  </div>
  <div id="todo" hidden>
    <p class="note" id="todonote"></p>
    <div class="grid" id="todogrid"></div>
  </div>
</main>
<aside id="drawer"></aside>
<iframe id="player" allow="autoplay"></iframe>
<script>
const D = /*DATA*/null;
const T = D.tracks;
for (const t of D.pending || []) { t.idx = T.length; T.push(t); }  // liked, not analyzed yet: playable, no tags
const SETS = D.kind === "sets";
const LIVE = location.protocol.startsWith("http");  // served by `sctag serve`: search + labelling
const byId = new Map(T.map(t => [t.id, t]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const art = t => (t.artwork_url || "").replace("-large.", "-t300x300.");
const short = g => g.split("---").pop();
const clock = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const length = t => t.duration_s >= 3600 ? `${Math.floor(t.duration_s / 3600)}h${String(Math.round(t.duration_s / 60) % 60).padStart(2, "0")}` : `${Math.round(t.duration_s / 60)} min`;

// your labels win over the text tags and the genre model's guesses
const genresOf = t => t.my_genres ?? [...t.text_genres, ...t.guess_genres].map(x => x[0]);
const energyOf = t => t.my_energy || t.energy;
const labelled = t => SETS ? !!t.my_energy : t.my_genres != null;
const energyText = t => t.my_energy ? `<b>${t.my_energy}</b> (yours)` : `<b>${t.energy}</b>${t.energy_arc ? ` (${t.energy_arc})` : ""}`;
const bpmText = t => SETS ? `${energyText(t)} · ${t.bpm_range[0]}–${t.bpm_range[1]} bpm` : `~${Math.round(t.bpm)} bpm`;
const [HOT, COOL] = D.energy_cut;
const ecls = e => e > HOT ? "e-hot" : e < COOL ? "e-cool" : "e-mid";
const strip = t => SETS ? `<div class="energy" title="energy over the set: orange = energetic, blue = calm">${
  t.timeline.map(w => `<i class="${ecls(w.energy)}"></i>`).join("")}</div>` : "";
document.title = SETS ? "Sets · SoundCloud likes" : "Tracks · SoundCloud likes";
$(SETS ? "#k-sets" : "#k-tracks").classList.add("on");
const subExtra = [];  // "likes fetched …", "since …"
function setSub() {
  const w = T.filter(t => t.pending).length;
  $("#sub").textContent = [`${T.length - w} ${SETS ? "sets" : "tracks"}`, ...(w ? [`${w} waiting for analysis`] : []),
    ...(LIVE ? [] : ["run sctag serve for live search and labelling"]),
    ...subExtra].join(" · ");
}
setSub();

function genreTags(t) {
  if (t.my_genres) return t.my_genres.map(g => `<span class="tag g mine" title="your label">${esc(g)}</span>`);
  return [...t.text_genres.map(([g, src]) => `<span class="tag g txt" title="from ${src}">${esc(g)}</span>`),
    ...t.guess_genres.map(([g]) => `<span class="tag g guess" title="guessed from audio by your genre model">${esc(g)}?</span>`)];
}
const sourceTags = t => (t.posted ? ' <span class="tag yours" title="you posted this">posted</span>' : "") +
  (t.reposted ? ' <span class="tag repost" title="you reposted this">repost</span>' : "");
// Dates. "Added" = when a track entered your library: your like, your repost, or the publish date of your own post.
// Only the sources picked in the Source chips count, so with "reposts" on, a track sorts by when you reposted it.
const day = d => (d || "").slice(0, 10);
const SOURCE_OF = { liked: "likes", reposted: "reposts", posted: "posts" };
const events = t => [["liked", t.liked !== false && t.liked_at], ["reposted", t.reposted && t.reposted_at],
  ["posted", t.posted && t.uploaded_at]].filter(e => e[1]);
function added(t) {
  const ev = events(t), picked = ev.filter(([k]) => !sel.s.size || sel.s.has(SOURCE_OF[k])), list = picked.length ? picked : ev;
  return list.length ? list.reduce((a, b) => (b[1] > a[1] ? b : a)) : ["added", t.liked_at || ""];
}
const released = t => t.release_date || t.uploaded_at || "";  // the artist's release date if set, else when it was published
const allDates = t => [...events(t).map(([k, d]) => `${k} ${day(d)}`), ...(released(t) ? [`released ${day(released(t))}`] : [])];
const datesLine = t => allDates(t).map(x => x[0].toUpperCase() + x.slice(1)).join(" · ");
const releaseSort = () => $("#sort").value.includes("releases");
const dateText = t => `<span title="${esc(allDates(t).join(" · "))}">${
  releaseSort() ? `released ${day(released(t))}` : added(t).map((x, i) => i ? day(x) : x).join(" ")}</span>`;
let busy = false;  // a refresh is running
// during a refresh every waiting track gets (re)tried; "failed" = the last attempt failed (DRM, geo-blocked, network…)
const pendText = t => busy ? "◌ analyzing…" : t.pending === "failed" ? "couldn’t be analyzed" : "◌ not analyzed yet";
function card(t) {
  if (t.pending) return `<div class="card wait" data-i="${t.idx}"><img loading="lazy" src="${esc(art(t))}" alt="">
    <div class="b"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}${sourceTags(t)}</div>
    <div class="bpm">${SETS ? length(t) + " · " : ""}${dateText(t)}</div><div class="bpm pend">${pendText(t)}</div></div></div>`;
  const tags = [
    ...genreTags(t),
    ...t.clap_moods.slice(0, 2).map(([m]) => `<span class="tag m" title="mood, compared to your library">${esc(m)}</span>`),
  ].join("");
  return `<div class="card" data-i="${t.idx}"><img loading="lazy" src="${esc(art(t))}" alt="">
    <div class="b"><div class="t" title="${esc(t.title)}">${esc(t.title)}</div><div class="a">${esc(t.artist)}${sourceTags(t)}</div>
    <div class="bpm">${SETS ? length(t) + " · " : ""}${bpmText(t)} · ${dateText(t)}</div>
    ${strip(t)}<div class="tags">${tags}</div></div></div>`;
}

// ---- library: search, sort, filters
const last = f => (a, b) => (!!a.pending - !!b.pending) || f(a, b);  // tracks without analysis go last
const dated = (f, dir) => (a, b) => { const x = f(a), y = f(b); return (!x - !y) || dir * x.localeCompare(y); };  // undated last
const SORTS = {
  "Recently added": dated(t => added(t)[1], -1),
  "Oldest added": dated(t => added(t)[1], 1),
  "Newest releases": dated(released, -1),
  "Oldest releases": dated(released, 1),
  "BPM, slow → fast": last((a, b) => a.bpm - b.bpm),
  "BPM, fast → slow": last((a, b) => b.bpm - a.bpm),
  ...(SETS ? { "Calmest first": last((a, b) => a.energy_score - b.energy_score),
    "Most energetic first": last((a, b) => b.energy_score - a.energy_score),
    "Shortest first": (a, b) => a.duration_s - b.duration_s } : {}),
};
$("#sort").innerHTML = Object.keys(SORTS).map(k => `<option>${k}</option>`).join("");
const sel = { m: new Set(), g: new Set(), e: new Set(), s: new Set() };
// remember the sort and the Source chips per page: the page reloads itself when new tags are ready
const PREFS = `sctag-prefs-${D.kind}`;
try {
  const p = JSON.parse(localStorage.getItem(PREFS) || "{}");
  if (p.sort in SORTS) $("#sort").value = p.sort;
  (p.sources || []).forEach(n => ["likes", "posts", "reposts"].includes(n) && sel.s.add(n));
} catch {}
function savePrefs() {
  try { localStorage.setItem(PREFS, JSON.stringify({ sort: $("#sort").value, sources: [...sel.s] })); } catch {}
}
const counted = (names, f, key) => { const c = {}; T.forEach(t => t.pending || f(t).forEach(n => c[n] = (c[n] || 0) + 1));
  return names.filter(n => c[n] || sel[key].has(n)).map(n => [n, c[n] || 0]); };
function chips(el, entries, key) {
  el.innerHTML = entries.map(([n, c]) => `<button class="chip${sel[key].has(n) ? " on" : ""}" data-n="${esc(n)}">${esc(n)}<i>${c}</i></button>`).join("");
}
// where a track comes from: your likes, your posts, your reposts (a track can be several)
const SOURCES = { likes: t => t.liked !== false, posts: t => !!t.posted, reposts: t => !!t.reposted };
const sourcesOf = t => Object.keys(SOURCES).filter(n => SOURCES[n](t));
const TOP_GENRES = 14;  // more behind "+ N more"
let allGenres = false;
function renderChips() {
  $("#srow").hidden = !T.some(t => t.posted || t.reposted) && !sel.s.size;
  chips($("#fs"), Object.entries(SOURCES).map(([n, f]) => [n, T.filter(f).length]), "s");  // always all three
  chips($("#fm"), counted(D.moods, t => t.clap_moods.map(x => x[0]), "m"), "m");
  const genres = counted(D.genres, genresOf, "g").sort((a, b) => b[1] - a[1]);
  const shown = allGenres ? genres : genres.filter(([g], k) => k < TOP_GENRES || sel.g.has(g));
  chips($("#fg"), shown, "g");
  if (genres.length > TOP_GENRES) $("#fg").insertAdjacentHTML("beforeend",
    `<button class="chip more" data-more>${allGenres ? "fewer" : `+ ${genres.length - shown.length} more`}</button>`);
  if (SETS) chips($("#fe"), counted(["energetic", "mixed", "calm"], t => [energyOf(t)], "e"), "e");
}
const bpmOn = () => +$("#bmin").value > +$("#bmin").min || +$("#bmax").value < +$("#bmax").max;
const nFilters = () => sel.m.size + sel.g.size + sel.e.size + sel.s.size + (bpmOn() ? 1 : 0);
for (const [id, key] of [["#fm", "m"], ["#fg", "g"], ["#fe", "e"], ["#fs", "s"]]) $(id).onclick = e => {
  if (e.target.closest("[data-more]")) { allGenres = !allGenres; return renderChips(); }
  const n = e.target.closest(".chip")?.dataset.n; if (n == null) return;
  sel[key].has(n) ? sel[key].delete(n) : sel[key].add(n);
  if (key === "s") savePrefs();
  renderChips(); render();
};
$("#erow").hidden = !SETS;
if (!T.some(t => t.posted || t.reposted)) $("#srow").title = "press Refresh likes to fetch your posts and reposts";
const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "");
const textOf = t => norm([t.title, t.artist, t.sc_genre, t.sc_tags].join(" "));
T.forEach(t => t._text = textOf(t));
function render() {
  const lo = +$("#bmin").value, hi = +$("#bmax").value, words = norm($("#q").value).split(/\s+/).filter(Boolean);
  $("#bl").textContent = `${lo}–${hi}`;
  // tracks still waiting for analysis have no moods, genres, energy or BPM: hidden as soon as one of those is used
  const tagged = sel.m.size || sel.g.size || sel.e.size || lo > +$("#bmin").min || hi < +$("#bmax").max;
  const ok = t => words.every(w => t._text.includes(w)) && (sel.s.size === 0 || sourcesOf(t).some(n => sel.s.has(n)))
    && (t.pending ? !tagged : analyzedOk(t));
  const analyzedOk = t => [...sel.m].every(m => t.clap_moods.some(x => x[0] === m))
    && (sel.g.size === 0 || genresOf(t).some(g => sel.g.has(g)))
    && (!SETS || sel.e.size === 0 || sel.e.has(energyOf(t)))
    && (SETS ? t.bpm_range[1] >= lo && t.bpm_range[0] <= hi : t.bpm >= lo && t.bpm <= hi);
  const list = T.filter(ok).sort(SORTS[$("#sort").value]);
  const n = nFilters();
  $("#count").textContent = list.length === T.length ? "" : `${list.length} of ${T.length} ${SETS ? "sets" : "tracks"}`;
  $("#fclear").hidden = !n;
  $("#ftoggle").innerHTML = `Filters${n ? `<b>${n}</b>` : ""}`;
  $("#grid").innerHTML = list.map(card).join("") || '<p class="sub">Nothing matches.</p>';
}
$("#bmin").oninput = $("#bmax").oninput = $("#q").oninput = render;
$("#sort").onchange = () => { savePrefs(); render(); };
// the filter panel folds away; open by default on a wide screen, remembered per page
const FOLD = `sctag-filters-${D.kind}`;
let foldPref = null;
try { foldPref = localStorage.getItem(FOLD); } catch {}
$("#filters").hidden = foldPref ? foldPref === "closed" : matchMedia("(max-width: 760px)").matches;
$("#ftoggle").onclick = () => {
  $("#filters").hidden = !$("#filters").hidden;
  try { localStorage.setItem(FOLD, $("#filters").hidden ? "closed" : "open"); } catch {}
};
$("#fclear").onclick = () => {
  Object.values(sel).forEach(x => x.clear());
  $("#bmin").value = $("#bmin").min; $("#bmax").value = $("#bmax").max;
  savePrefs(); renderChips(); render();
};

// ---- vibe / cover search: examples baked in at build time, plus a live box when served
const strip6 = list => `<div class="strip">${list.map(card).join("")}</div>`;
$("#vibe .examples").innerHTML = Object.entries(D.vibe).map(([q, hits]) =>
  `<section><h2>“${esc(q)}”</h2>${strip6(hits.map(([i]) => T[i]))}</section>`).join("");
$("#cover .examples").innerHTML = Object.entries(D.covers).map(([q, hits]) =>
  `<section><h2>“${esc(q)}”</h2>${strip6(hits.map(([i]) => T[i]))}</section>`).join("");
$("#vibe .note").textContent = LIVE ? "Text → audio search with CLAP." + (SETS ? " Sets match on their best passage." : "")
  : "Text → audio search with CLAP. These example queries were run when the report was built; run sctag serve for a search box.";
$("#cover .note").textContent = "Text → cover art search with CLIP." + (LIVE ? "" : " Run sctag serve for a search box.");
for (const mode of ["vibe", "cover"]) {
  const box = $("#" + mode), form = box.querySelector("form");
  form.hidden = !LIVE;
  form.onsubmit = async e => {
    e.preventDefault();
    const q = form.q.value.trim(); if (!q) return;
    const out = box.querySelector(".results");
    out.innerHTML = '<p class="sub">Searching… (the first search loads the models, ~20 s)</p>';
    const hits = await (await fetch(`/api/search?kind=${D.kind}&mode=${mode}&q=${encodeURIComponent(q)}`)).json();
    out.innerHTML = hits.map(([id]) => byId.get(id)).filter(Boolean).map(card).join("");
    box.querySelector(".examples").hidden = true;
  };
}

// ---- labelling (served only): your labels go to data/labels.json and train the genre model on "Retrain"
const queue = () => T.filter(t => t.label_priority != null && !labelled(t)).sort((a, b) => a.label_priority - b.label_priority);
$("#todonote").innerHTML = SETS
  ? "Sets whose energy is the least clear-cut. Open one, skim the timeline, and click the energy that fits (✓ if the guess is right). Your answers override the guess and show where to move the energy cutoffs."
  : `Untagged tracks your genre model is least sure about. Open one, listen, click the genres that fit (✓ if the guess is right, or type your own tag), then <b>Next</b>. Press <b>Retrain</b> after a batch: genres need ${D.min_positives} labelled tracks to be learned. Learned so far: ${D.learned.map(esc).join(", ")}.`;
function renderTodo() { $("#todogrid").innerHTML = queue().slice(0, 60).map(card).join("") || '<p class="sub">Nothing left to label.</p>'; }
async function save(t, body) {
  const labels = await (await fetch("/api/labels", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: t.id, ...body }) })).json();
  applyLabels(labels);
  open(t.idx, false); renderChips(); render(); renderTodo();
}
function applyLabels(labels) {
  T.forEach(t => { const l = labels[t.id] || {}; t.my_genres = l.genres ?? null; t.my_energy = l.energy ?? null; });
  T.forEach(t => (t.my_genres || []).forEach(g => D.genres.includes(g) || D.genres.push(g)));
  const n = Object.keys(labels).length;
  $("#retrain").hidden = !n;
  $("#retrain").textContent = `Retrain (${n} label${n === 1 ? "" : "s"})`;
}
function labelBox(t) {
  const current = t.my_genres ?? t.text_genres.map(x => x[0]), guessed = t.guess_genres.map(x => x[0]);
  return `<div class="labelbox"><h3>Your labels ${labelled(t) ? "· saved" : ""}</h3>
    ${SETS ? `<div class="row" data-act="energy">${["energetic", "mixed", "calm"].map(e =>
      `<button class="chip${t.my_energy === e ? " on" : ""}${!t.my_energy && t.energy === e ? " sug" : ""}" data-n="${e}">${e}</button>`).join("")}</div>` : ""}
    <div class="row" data-act="genre">${D.genres.map(g =>
      `<button class="chip${current.includes(g) ? " on" : ""}${guessed.includes(g) ? " sug" : ""}" data-n="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div class="row"><input type="text" id="newtag" placeholder="your own tag ↵" size="14">
      <button class="btn" data-act="ok" title="${SETS ? "keep the energy guess" : "keep the title tags and the guesses (green outline)"}">✓ Looks right</button>
      <button class="btn" data-act="clear">Clear</button>
      <button class="btn primary" data-act="next">Next →</button></div></div>`;
}
$("#drawer").addEventListener("click", e => {
  const t = T[+$("#drawer").dataset.i], b = e.target.closest("[data-n], [data-act]"); if (!b || !t) return;
  const act = b.dataset.act || b.parentElement.dataset.act, n = b.dataset.n;
  if (act === "genre") {
    const cur = new Set(t.my_genres ?? t.text_genres.map(x => x[0]));
    cur.has(n) ? cur.delete(n) : cur.add(n);
    save(t, { genres: [...cur] });
  } else if (act === "energy") save(t, { energy: t.my_energy === n ? null : n });
  else if (act === "ok") save(t, SETS ? { energy: energyOf(t) } : { genres: genresOf(t) });
  else if (act === "clear") save(t, { genres: null, energy: null });
  else if (act === "next") { const nx = queue().find(x => x !== t); if (nx) open(nx.idx); }
});
$("#drawer").addEventListener("keydown", e => {
  if (e.target.id !== "newtag" || e.key !== "Enter") return;
  const t = T[+$("#drawer").dataset.i], g = e.target.value.trim().toLowerCase(); if (!g) return;
  save(t, { genres: [...new Set([...(t.my_genres ?? t.text_genres.map(x => x[0])), g])] });
});
$("#retrain").onclick = async () => {
  const b = $("#retrain"); b.disabled = true; b.textContent = "Retraining… (~1 min)";
  const r = await (await fetch("/api/rebuild", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })).json();
  if (r.ok) location.reload(); else { b.disabled = false; b.textContent = "Retrain failed (see console)"; console.log(r.log); }
};

// ---- refresh (served only): fetch new likes and your uploads, analyze the new ones, rebuild
const STEPS = { fetch: "Fetching likes, posts and reposts…", rebuild: "Rebuilding reports…" };
const ago = s => { const d = (Date.now() / 1000 - s) / 86400;
  return d < 1 ? "today" : d < 2 ? "yesterday" : `${Math.floor(d)} days ago`; };
let seenRebuilds = null, tagsReady = false, merged = false;  // rebuilds of this page's report already shown
function showJob(j) {
  const b = $("#refresh"), was = busy;
  busy = j.state === "running";
  $("#retrain").disabled = busy;
  b.disabled = busy && !tagsReady;
  if (tagsReady) b.textContent = "✓ New tags ready — reload";
  else if (busy) b.textContent = "⟳ " + (STEPS[j.step] || `Analyzing ${j.step}${j.total ? ` ${j.done} / ${j.total}` : "…"}`);
  else b.textContent = j.state === "failed" ? "⟳ Refresh failed — see terminal" : "⟳ Refresh likes";
  if (busy !== was) render();  // "analyzing…" vs "not analyzed yet"
}
async function mergeWaiting() {  // new likes show up right after the fetch, untagged but playable
  const list = await (await fetch(`/api/pending?kind=${D.kind}`)).json();
  const added = list.filter(t => !byId.has(t.id));
  for (const t of added) { t.idx = T.length; t._text = textOf(t); T.push(t); byId.set(t.id, t); }
  if (added.length) { setSub(); renderChips(); render(); }
}
const noteFor = j => j.new ? `refreshed just now: ${j.new} new${j.failed ? `, ${j.failed} couldn’t be analyzed` : ""}`
  : "refreshed just now: up to date";
function reloadWithNote(j) {
  try { sessionStorage.setItem("sctag-note", noteFor(j)); } catch {}
  location.reload();
}
async function poll() {
  const j = await (await fetch("/api/refresh")).json();
  const rebuilds = (j.rebuilds || {})[D.kind] || 0;
  seenRebuilds ??= rebuilds;
  if (j.state === "running" && j.fetched && !merged) { merged = true; await mergeWaiting(); }
  if (rebuilds > seenRebuilds) {
    // the report has tags for more likes: offer them, and reload by itself only at the end when nothing plays
    seenRebuilds = rebuilds;
    tagsReady = true;
    $("#refresh").dataset.note = noteFor(j);
  }
  if (tagsReady && j.state !== "running" && !$("#player").getAttribute("src")) return reloadWithNote(j);
  showJob(j);
  if (j.state === "running") return setTimeout(poll, 2000);
  if (j.state === "failed") console.log(j.error);
}
$("#refresh").onclick = async () => {
  if (tagsReady) {
    try { sessionStorage.setItem("sctag-note", $("#refresh").dataset.note); } catch {}
    return location.reload();
  }
  let { username } = await (await fetch("/api/refresh")).json();
  if (!username) {
    username = (prompt("Your SoundCloud username (the part after soundcloud.com/)") || "").trim();
    if (!username) return;
  }
  seenRebuilds = 0;  // a new job: all its rebuilds count
  merged = false;
  const r = await fetch("/api/refresh", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username }) });
  if (!r.ok && r.status !== 409) { $("#refresh").textContent = "⟳ Refresh failed — see terminal"; return; }
  poll();
};

// ---- details drawer
const bar = p => `<span class="bar"><i style="width:${Math.round(p * 100)}%"></i></span>`;
function open(i, play = true) {
  const t = T[i], d = $("#drawer");
  const rows = (list, f = x => x) => list.map(([n, p]) => `<tr><td>${esc(f(n))}</td><td>${p.toFixed(2)}</td></tr>`).join("");
  const bin = ["danceable", "aggressive", "party", "happy", "sad", "relaxed", "bright", "instrumental", "tonal"];
  const keepScroll = d.dataset.i == i ? d.scrollTop : 0;
  d.dataset.i = i;
  const close = `<button class="close" onclick="$('#drawer').classList.remove('open')" aria-label="close">×</button>`;
  const head = `${close}<div class="head"><img src="${esc((t.artwork_url || "").replace("-large.", "-t300x300."))}" alt="">
    <div><h2>${esc(t.title)}</h2><div class="a">${esc(t.artist)}${sourceTags(t)}</div>
    <div class="bpm" style="margin-top:6px">${esc(datesLine(t))}</div>
    <div style="margin-top:6px"><a href="${esc(t.url)}" target="_blank">Open on SoundCloud ↗</a></div></div></div>`;
  if (t.pending) {
    d.innerHTML = `${head}<p class="facts">${length(t)} · SoundCloud genre: <b>${esc(t.sc_genre || "—")}</b></p>
      <p class="pend">${t.pending === "failed" && !busy ? "The last attempt to analyze this track failed (often DRM or geo-blocking), so it has no tags yet."
        : "Tags appear once this track is analyzed."}</p>`;
  } else d.innerHTML = `${head}
    <p class="facts">${length(t)} ·
      ${SETS ? `${energyText(t)}: ${Math.round(t.energetic_share * 100)}% energetic, ${Math.round(t.calm_share * 100)}% calm ·
        <b>${t.bpm_range[0]}–${t.bpm_range[1]}</b> bpm (median ${Math.round(t.bpm)})` : `<b>~${Math.round(t.bpm)}</b> bpm`} ·
      SoundCloud genre: <b>${esc(t.sc_genre || "—")}</b></p>
    ${SETS ? strip(t) : ""}
    ${LIVE ? labelBox(t) : `<div class="tags">${genreTags(t).join("")}</div>`}
    ${t.text_genres.length ? `<h3>From title &amp; tags</h3><table>${t.text_genres.map(([g, src]) =>
      `<tr><td>${esc(g)}</td><td>${esc(src)}</td></tr>`).join("")}</table>` : ""}
    <h3>Guessed from audio</h3>
    <table>${rows(t.clap_moods)}${t.guess_genres.map(([g, p]) =>
      `<tr><td>${esc(g)}?</td><td>${SETS ? `${Math.round(p * 100)}% of windows` : `${p.toFixed(1)}× cutoff`}</td></tr>`).join("")}</table>
    ${SETS ? `<h3>Timeline · one 30 s window every ~4 min</h3>
    <table class="timeline">${t.timeline.map(w => `<tr><td><a href="${esc(t.url)}#t=${clock(w.t)}" target="_blank">${clock(w.t)}</a></td>
      <td><span class="dot ${ecls(w.energy)}"></span>${Math.round(w.bpm)}</td><td>${esc(w.guess || "")}</td><td>${esc(short(w.genre))}</td><td>${esc(w.mood)}</td></tr>`).join("")}</table>` : ""}
    <h3>More like this</h3><div class="similar">${t.similar.slice(0, 3).map(j => card(T[j])).join("")}</div>
    <details><summary>Audio analysis details (Essentia)</summary>
    ${SETS ? `<h3>Discogs style mix · share of windows</h3><table>${rows(t.genre_mix, x => x.replace("---", " › "))}</table>` : ""}
    <h3>Discogs styles${SETS ? " · whole-set average" : ""}</h3><table>${rows(t.discogs_genres, x => x.replace("---", " › "))}</table>
    ${SETS ? "" : `<h3>BPM per window</h3><table><tr><td>${t.bpm_windows.join(" · ")}</td><td>${t.bpm}</td></tr></table>`}
    <h3>Mood / theme (Jamendo)</h3><table>${rows(t.moodtheme)}</table>
    <h3>Mood classifiers</h3>
    <table>${bin.map(k => `<tr><td>${k}</td><td>${bar(t[k])}${t[k].toFixed(2)}</td></tr>`).join("")}</table></details>`;
  d.classList.add("open");
  d.scrollTop = keepScroll;
  if (!play) return;
  const p = $("#player");
  p.src = `https://w.soundcloud.com/player/?url=${encodeURIComponent(t.url)}&auto_play=true&visual=false&show_comments=false`;
  p.style.display = "block";
}
document.addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) open(+c.dataset.i);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer").classList.remove("open"); });
document.querySelector("nav").onclick = e => {
  const v = e.target.dataset.v; if (!v) return;
  document.querySelectorAll("nav button[data-v]").forEach(b => b.classList.toggle("on", b === e.target));
  ["lib", "vibe", "cover", "todo"].forEach(id => $("#" + id).hidden = id !== v);
  if (v === "todo") renderTodo();
};

(async () => {
  if (LIVE) {
    document.querySelector('nav [data-v="todo"]').hidden = $("#refresh").hidden = false;
    applyLabels(await (await fetch("/api/labels")).json());
    let note = null;
    try { note = sessionStorage.getItem("sctag-note"); sessionStorage.removeItem("sctag-note"); } catch {}
    const j = await (await fetch("/api/refresh")).json();
    if (note || j.fetched_at) subExtra.push(note || `likes fetched ${ago(j.fetched_at)}`);
    if (j.liked_since) subExtra.push(`since ${j.liked_since}`);
    setSub();
    poll();
  }
  renderChips(); render();
})();
</script>
</body>
</html>
